name: Build macOS x64 system libraries
on:
  workflow_call:
    inputs:
      sc-version:
        required: true
        type: string

jobs:
  build-macos-x64-system-libraries:
    runs-on: macos-12
    name: macOS x64 system libraries
    env:
      # bump the number to invalidate the cache
      CACHE_KEY: macos-x64-system-libraries-1
      BUILD_PATH: ${{ github.workspace }}/build
      INSTALL_PATH: ${{ github.workspace }}/build/Install
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      DEVELOPER_DIR: "/Applications/Xcode_13.4.1.app/Contents/Developer"
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_ARCHITECTURES: "x86_64"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: prepare timestamp for cache
        id: current-date
        run: |
          echo "stamp=$(date '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "week=$(date '+%U')" >> $GITHUB_OUTPUT

      - name: cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ env.CACHE_KEY }}-ccache-${{ steps.current-date.outputs.week }}
          restore-keys: ${{ env.CACHE_KEY }}-ccache-
      
      - name: cleanup homebrew downloads
        # always remove existing downloads first, as we bring back relevant downloads from cache
        run: rm -rf $(brew --cache)

      - name: cache homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ env.CACHE_KEY }}-homebrew-${{ steps.current-date.outputs.week }}
          restore-keys: ${{ env.CACHE_KEY }}-homebrew-

      - name: install brew dependencies
        run: |
          brew install \
            ccache \
            portaudio \
            qt@5 \
            yaml-cpp \
            boost
          # add ccamke to PATH - see https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-commands-for-github-actions
          echo "/usr/local/opt/ccache/libexec" >> $GITHUB_PATH

      - name: configure
        run: |
          mkdir $BUILD_PATH && cd $BUILD_PATH
          cmake \
            -G "Xcode" \
            -DSC_VERIFY_APP=ON \
            -DCMAKE_PREFIX_PATH=/usr/local/opt/qt@5 \
            -DSYSTEM_BOOST=ON \
            -DSYSTEM_YAMLCPP=ON \
            -DRULE_LAUNCH_COMPILE=ccache \
            -DSUPERNOVA=ON \
            ..

      - name: build
        run: cmake --build $BUILD_PATH --config Release --target install
