name: Build MacOS x64 legacy
on:
  workflow_call:
    inputs:
      sc-version:
        required: true
        type: string

jobs:
  build-macos-x64-legacy:
    runs-on: macos-12
    name: macOS x64 legacy
    env:
      # bump the number to invalidate the cache
      CACHE_KEY: macos-x64-legacy-1
      BUILD_PATH: ${{ github.workspace }}/build
      INSTALL_PATH: ${{ github.workspace }}/build/Install
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      ARTIFACT_FILE: "SuperCollider-${{ inputs.sc-version }}-macOS-x64-legacy.dmg"
      DEVELOPER_DIR: "/Applications/Xcode_13.4.1.app/Contents/Developer"
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_ARCHITECTURES: "x86_64"
      VCPKG-TRIPLET: x64-osx-release-supercollider
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: prepare timestamp for cache
        id: current-date
        run: |
          echo "stamp=$(date '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "week=$(date '+%U')" >> $GITHUB_OUTPUT

      - name: cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ env.CACHE_KEY }}-ccache-${{ steps.current-date.outputs.week }}
          restore-keys: ${{ env.CACHE_KEY }}-ccache-
      
      - name: cleanup homebrew downloads
        # always remove existing downloads first, as we bring back relevant downloads from cache
        run: rm -rf $(brew --cache)

      - name: cache homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ env.CACHE_KEY }}-homebrew-${{ steps.current-date.outputs.week }}
          restore-keys: ${{ env.CACHE_KEY }}-homebrew-

      - name: cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ env.CACHE_KEY }}-vcpkg-${{ steps.current-date.outputs.stamp }}
          restore-keys: ${{ env.CACHE_KEY }}-vcpkg-

      - name: install brew dependencies
        run: |
          brew install ccache
          # add ccamke to PATH - see https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-commands-for-github-actions
          echo "/usr/local/opt/ccache/libexec" >> $GITHUB_PATH
      
      - name: install libsndfile # to make it compatible with older OSes (lower deployment target)
        run: |
          brew uninstall --ignore-dependencies libsndfile libvorbis libogg flac opus
          vcpkg install libsndfile --triplet="${{ env.VCPKG-TRIPLET }}" --overlay-triplets="$GITHUB_WORKSPACE/vcpkg/triplets"
    
      - name: install fftw # to allow cross-compiling
        run: |
          vcpkg install fftw3 --triplet="${{ env.VCPKG-TRIPLET }}" --overlay-triplets="$GITHUB_WORKSPACE/vcpkg/triplets"

      - name: install qt using aqtinstall
        uses: jurplel/install-qt-action@v3
        env:
          DEVELOPER_DIR: "" # remove developer dir which causes installation to fail
        with:
          modules: "qtwebengine"
          version: "5.15.2"
          cache: true
          cache-key-prefix: ${{ env.CACHE_KEY }}-qt

      - name: configure
        run: |
          mkdir $BUILD_PATH && cd $BUILD_PATH
          export VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT
          cmake \
            -G "Xcode" \
            -DRULE_LAUNCH_COMPILE=ccache \
            -DCMAKE_PREFIX_PATH=`brew --prefix qt@5` \
            -DSYSTEM_PORTAUDIO=OFF \
            -DSUPERNOVA=ON \
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG-TRIPLET }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_VERIFY_APP=ON \
            ..

      - name: build
        run: cmake --build $BUILD_PATH --config Release --target install

      - name: create archive
        run: |
          cd $INSTALL_PATH
          ln -s /Applications SuperCollider/Applications
          mkdir -p SuperCollider/.background
          cp ../../package/background_2_arrow.png SuperCollider/.background/background_2_arrow.png
          cp ../../package/ds_store SuperCollider/.DS_Store
          # the following assumes that we end up with the build in the folder SuperCollider
          # hdiutil sometimes fails with "create failed - Resource busy"
          # when that happens, we run it again
          hdiutil create -srcfolder SuperCollider -format UDZO -fs HFS+ $ARTIFACT_FILE || hdiutil create -srcfolder SuperCollider -format UDZO -fs HFS+ $ARTIFACT_FILE

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_FILE }}
          path: ${{ env.INSTALL_PATH }}/${{ env.ARTIFACT_FILE }}
